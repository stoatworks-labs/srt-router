[package]
name = "srtrouter"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "srtrouter"
path = "src/main.rs"

[dependencies]
diag = { path = "../diag" }
crosspoint-core = { path = "../core" }
srt-io = { path = "../srt-io" }
ndi-io = { path = "../ndi-io", optional = true }
omt-io = { path = "../omt-io", optional = true }
media-io = { path = "../media-io" }
crosspoint-web = { path = "../web" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
# NDI is on by default. It used to be off because `ndi-io` linked the
# proprietary NDI SDK at build time, so no cross-compiled release target could
# enable it — which meant every released binary shipped without the NDI
# transport. `ndi-io` now loads the runtime with `dlopen` (see its `sys` module)
# and needs nothing at build time, so the flag is only an opt-out for a smaller
# binary, never a build requirement.
default = ["ndi"]
ndi = ["dep:ndi-io"]
# `omt-io` still links its SDK at build time, so this stays opt-in.
omt = ["dep:omt-io"]
