# Cloudflare deployment for srt-router's recorded click-through demo.
#
# This is a static-assets-only Worker: no server code, just the directory below,
# which is committed to the repo. It has to be committed — assembling the demo
# means running the app against its mock devices and recording what it says, and
# a build container can't do that. So there is no build command; Cloudflare
# publishes what is already here.
#
# Without this file, `wrangler deploy` looks for a static directory at the repo
# root, finds none (the site lives under demo/), and fails with "Could not
# detect a directory containing static files".
#
# `name` must match the Cloudflare project. Change it here if the project was
# created under a different one.

name = "srt-router"
compatibility_date = "2026-07-30"

[assets]
directory = "./demo/dist"
