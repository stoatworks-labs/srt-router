# Generated by stoatworks-unraid/scripts/gen-docker.mjs.
# srt-router has no _headers file, so only the baseline headers below are applied.
# Edit the generator, not this file — changes made here are overwritten.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's bundled mime.types has lagged on both of these depending on the
    # base image. Serving a .wasm as application/octet-stream makes
    # instantiateStreaming refuse it, and a .mjs served as text/plain is
    # rejected by the module loader — both fail at run time in the browser with
    # errors that point nowhere near the web server.
    types {
        application/wasm  wasm;
        text/javascript   mjs;
    }

    # Compress the text payloads. Not gzipping wasm/png/jpg on purpose: they are
    # already compressed and the CPU is wasted.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Hide the nginx version from error pages and the Server header.
    server_tokens off;

    # The health endpoint the container HEALTHCHECK hits. Kept out of the access
    # log so a 30-second probe does not bury real traffic.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/snippets/stoatworks-headers.conf;
        try_files $uri $uri/ =404;
    }
}
