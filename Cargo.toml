[workspace]
resolver = "2"
members = [
    "crates/diag",
    "crates/core",
    "crates/srt-io",
    "crates/web",
    "crates/router",
    "crates/ndi-io",
    "crates/omt-io",
    "crates/media-io",
]
# Plain `cargo build`/`cargo test` (no -p) touches these. The rule is simply
# "needs no non-crates.io SDK at build time":
#
#   ndi-io   qualifies since it stopped linking the NDI SDK and started loading
#            the runtime with dlopen (see crates/ndi-io/src/sys.rs). Its tests
#            skip themselves when no runtime is installed, so a machine without
#            NDI still gets a clean `cargo test`.
#   omt-io   does not: it still links libomt, so it needs OMT_LIB_DIR and stays
#            out, reachable via `-p omt-io` and the router's opt-in `omt`
#            feature.
#   media-io only shells out to `ffmpeg` at runtime, so it has always been in
#            (CI `apt-get install`s ffmpeg explicitly).
default-members = [
    "crates/core",
    "crates/srt-io",
    "crates/web",
    "crates/router",
    "crates/media-io",
    "crates/ndi-io",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/stoatworks-labs/srt-router"
